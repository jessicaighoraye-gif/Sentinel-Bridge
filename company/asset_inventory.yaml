# Florence Inc. asset inventory (fictional).
# Asset IDs use the AST- prefix and are referenced by scenarios and findings.
# Tier values come from data_classification.yaml.

assets:
  - asset_id: AST-IDP-001
    name: Identity platform (cloud identity tenant)
    category: identity_platform
    environment: cloud
    criticality: critical
    data_classification: tier_1
    business_function: Workforce authentication and access management
    owner_role: IT Operations Manager

  - asset_id: AST-DB-001
    name: Customer database
    category: customer_database
    environment: cloud
    criticality: critical
    data_classification: tier_1
    business_function: Stores customer PII and payment-related records
    owner_role: Head of Engineering

  - asset_id: AST-APP-001
    name: Payment application platform
    category: payment_application_infrastructure
    environment: cloud
    criticality: critical
    data_classification: tier_1
    business_function: Customer-facing payment processing
    owner_role: Head of Engineering

  - asset_id: AST-SRV-001
    name: Payment gateway server
    category: payment_application_infrastructure
    environment: on_premises
    criticality: critical
    data_classification: tier_1
    business_function: Routes payment transactions to partner networks
    owner_role: IT Operations Manager

  - asset_id: AST-SRV-002
    name: Reconciliation server
    category: payment_application_infrastructure
    environment: on_premises
    criticality: critical
    data_classification: tier_1
    business_function: Settlement and transaction reconciliation
    owner_role: IT Operations Manager

  - asset_id: AST-END-001
    name: Onsite endpoint fleet (laptops and workstations)
