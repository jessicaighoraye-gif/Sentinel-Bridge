# Remediation per detector. Verification is the detector itself: re-run it on updated evidence and expect PASS.
rules:
  DET-MFA: {control_id: CTRL-IAM-001, effort: low, gap: "Privileged accounts can sign in with a password alone.", outcome: "Every privileged human and break-glass account has MFA enrolled and enforced.", remediation: "Enroll the affected privileged accounts in MFA and enforce a policy that requires MFA for all privileged roles."}
  DET-EXCESS-PRIV: {control_id: CTRL-IAM-002, effort: medium, gap: "Users hold permissions they neither use nor have approval for.", outcome: "Assigned permissions match approved scope or observed use over 90 days.", remediation: "Remove the unused permissions the detector listed, then run a quarterly access review for privileged roles."}
  DET-INACTIVE-ACCT: {control_id: CTRL-IAM-003, effort: low, gap: "Accounts of former staff remain enabled.", outcome: "No enabled human account is idle for more than 90 days.", remediation: "Disable the idle accounts, tie account removal to the leaver process, and auto-disable accounts after 90 days of inactivity."}
  DET-PASSWORD: {control_id: CTRL-IAM-004, effort: low, gap: "The local password policy is below baseline.", outcome: "Policy meets the length, complexity, expiry and lockout baseline.", remediation: "Set minimum length to 12 or more, require complexity, set a maximum age, and lock accounts after 10 failed attempts or fewer."}
  DET-ENC-REST: {control_id: CTRL-DATA-001, effort: medium, gap: "Sensitive data stores are unencrypted or lack a customer-managed key.", outcome: "All sensitive stores use AES-256, tier 1 with customer-managed keys.", remediation: "Enable AES-256 encryption on the customer database and move tier 1 stores to customer-managed keys in the key management service."}
  DET-ENC-TRANSIT: {control_id: CTRL-DATA-002, effort: medium, gap: "Sensitive flows use cleartext or outdated TLS.", outcome: "All sensitive flows use TLS 1.2 or higher with strong ciphers, or mTLS inside the network.", remediation: "Disable HTTP and TLS 1.0 and 1.1 on the affected endpoints, remove weak ciphers, and require partners to support TLS 1.2 or higher."}
  DET-VULN-SW: {control_id: CTRL-END-001, effort: high, gap: "Servers run software the vendor no longer supports or that carries severe vulnerabilities.", outcome: "No asset runs end-of-life software or unpatched CVEs rated 7.0 or higher.", remediation: "Migrate the affected servers to supported versions, patch severe CVEs, and keep an end-of-life register."}
  DET-ENDPOINT: {control_id: CTRL-END-002, effort: low, gap: "Endpoints lack active, current protection.", outcome: "Every in-scope endpoint has the agent installed, active and current.", remediation: "Reinstall the agent on the affected devices, force a definition update, and alert when a device falls out of compliance."}
  DET-LOGGING: {control_id: CTRL-LOG-001, effort: low, gap: "Required log sources are silent or have auditing off.", outcome: "All required sources are active, audited, reporting within 24 hours and ingesting normally.", remediation: "Restore the silent log forwarder, enable database auditing, and alert when a source stops reporting."}
  DET-CLOUD-EXPOSURE: {control_id: CTRL-CLD-001, effort: low, gap: "Storage holding sensitive data is publicly accessible.", outcome: "No storage holding sensitive data is publicly accessible.", remediation: "Turn on block-public-access for the affected buckets, remove public ACLs, and review access logs for earlier exposure."}
  DET-BACKUP: {control_id: CTRL-BCP-001, effort: medium, gap: "Backups are missing, stale, or not protected from tampering.", outcome: "Every stateful asset has a recent successful backup, 30-day retention and, for tier 1, immutability.", remediation: "Create the missing backup policy, fix the failing job, and enable immutable storage for tier 1 backups."}
  DET-REMOTE-ACCESS: {control_id: CTRL-NET-001, effort: low, gap: "Administrative ports are open to the whole internet.", outcome: "No administrative port is exposed to 0.0.0.0/0 except through a controlled mechanism that requires MFA.", remediation: "Remove the direct rule and move remote administration behind zero trust access or a VPN with MFA."}
